apiVersion: 1

datasources:
  - name: Network Scan PostgreSQL
    uid: network-scan-postgres
    type: postgres
    access: proxy
    url: postgres:5432
    user: ${POSTGRES_USER}
    secureJsonData:
      password: ${POSTGRES_PASSWORD}
    jsonData:
      database: ${POSTGRES_DB}
      sslmode: disable
      postgresVersion: 16
      timescaledb: false
    isDefault: true
